# Стенд: postgres, keycloak, api, face, web, http и https.
# Телефон без сертификата: http://$LAN_IP:8080/phone . VPN выключен.
# https://$LAN_IP:8443 остаётся. Туннель не нужен.
# face — сборка Саши, порог 0.69, каталог не переносить.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prohodnaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: prohodnaya
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prohodnaya -d prohodnaya"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: prohodnaya
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      KC_HTTP_ENABLED: "true"
      # start-dev сам ставит hostname-strict=false. Полный KC_HOSTNAME не задаём:
      # схема и порт берутся из запроса, поэтому http://LAN:8080 и https://LAN:8443
      # оба остаются фронтом Keycloak. Прямой localhost:8081 для ноутбука тоже жив.
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./apps/api
    environment:
      PORT: 3001
      DATABASE_URL: postgres://prohodnaya:${POSTGRES_PASSWORD:-change-me}@postgres:5432/prohodnaya
      KEYCLOAK_ISSUER: "https://${LAN_IP:?Задайте LAN_IP в .env — адрес ноутбука в Wi-Fi}:8443/realms/prohodnaya,http://${LAN_IP}:8080/realms/prohodnaya,http://localhost:8081/realms/prohodnaya,http://127.0.0.1:8081/realms/prohodnaya"
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/prohodnaya/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      FACE_SERVICE_URL: http://face:8000
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      ATTEMPT_TTL_SECONDS: 25
      WEB_ORIGIN: "https://${LAN_IP:?Задайте LAN_IP в .env — адрес ноутбука в Wi-Fi}:8443,http://${LAN_IP}:8080,http://localhost:43123,http://127.0.0.1:43123"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  face:
    build: ./deliverables/a-shorokhov-face-model/services/face
    environment:
      FACE_MODEL_ROOT: /models
      FACE_MATCH_THRESHOLD: "0.69"
      FACE_DETECT_CONFIDENCE: "0.25"
      FACE_LIVENESS_THRESHOLD: "0.8"
    volumes:
      - face_models:/models

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
        NEXT_PUBLIC_USE_PAGE_ORIGIN: "1"
    ports:
      - "43123:43123"
    depends_on:
      - api

  # Одноразово дописывает redirect URI в уже импортированный realm.
  keycloak-redirects:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ["/bin/bash", "/tune-redirects.sh"]
    environment:
      LAN_IP: ${LAN_IP:?Задайте LAN_IP в .env — адрес ноутбука в Wi-Fi}
      PHONE_HTTP_ORIGIN: http://${LAN_IP}:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./infra/keycloak/tune-redirects.sh:/tune-redirects.sh:ro
    depends_on:
      - keycloak
    restart: "no"

  https:
    image: caddy:2-alpine
    environment:
      LAN_IP: ${LAN_IP:?Задайте LAN_IP в .env — адрес ноутбука в Wi-Fi}
    ports:
      - "0.0.0.0:8080:8080"
      - "8443:8443"
      - "8088:8088"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - keycloak

volumes:
  pgdata:
  face_models:
  caddy_data:
  caddy_config:
